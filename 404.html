<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Shohel Rana</title>

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .error-page {
            max-width: 600px;
            width: 100%;
        }

        .error-code {
            font-size: clamp(90px, 20vw, 180px);
            font-weight: 800;
            line-height: 1;
            color: #673DE6;
        }

        h1 {
            margin-top: 20px;
            font-size: clamp(28px, 5vw, 42px);
        }

        p {
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
        }

        .home-button {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 28px;
            border-radius: 8px;
            background: #673DE6;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .home-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <main class="error-page">
        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you're looking for doesn't exist
            or may have been moved.
        </p>

        <a class="home-button" href="/">
            Back to Home
        </a>
    </main>

</body>
</html>
